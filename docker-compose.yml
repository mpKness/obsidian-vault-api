services:
  vault-api:
    image: ghcr.io/${GHCR_OWNER:-mpkne}/vault-api:${VAULT_API_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: vault-api
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      OBSIDIAN_VAULT_ROOT: /vault
      ADDR: ":8787"
      JWT_ISSUER: "obsidian-vault-api"
      JWT_AUDIENCE: "vault-clients"
      JWT_SECRET: "${JWT_SECRET}"
      # optional: tighten permissions by folder allowlist
      # ALLOW_PREFIXES: "Aarde,World,Sessions"
    volumes:
      - "${VAULT_PATH}:/vault:rw"
    networks:
      - internal

  caddy:
    image: caddy:${CADDY_IMAGE_TAG:-2.8-alpine}
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - vault-api
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
      - edge

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_IMAGE_TAG:-latest}
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    depends_on:
      - caddy
    networks:
      - edge

networks:
  internal:
    driver: bridge
  edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
